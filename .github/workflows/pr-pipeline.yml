name: Pull Request Pipeline

on:
  pull_request:
    branches: ['main', 'dev']
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  enforce-branch-flow:
    name: Enforce Main PR Source Branch
    runs-on: ubuntu-latest
    if: github.base_ref == 'main'
    steps:
      - name: Verify PR originates from dev
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" != "dev" ] && [[ "$HEAD_REF" != dependabot/* ]]; then
            echo "::error::Pull requests targeting 'main' must originate from 'dev' or dependabot."
            exit 1
          fi
          echo "PR source is '$HEAD_REF'. Approved to proceed."

  commitlint:
    name: Commit Message Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Lint PR commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npx commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

  validate-static:
    name: Static Analysis & Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate workflow syntax (actionlint)
        uses: reviewdog/action-actionlint@v1
        with:
          fail_level: error
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Verify formatting
        run: npm run format:check
      - name: Run linters
        run: npm run lint
      - name: Audit dependencies (high and above)
        run: npm run audit

  build:
    name: Production Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Check built page references the Pages base path
        run: grep -q '/credentials/assets/' dist/index.html

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.base_ref == 'main'
    steps:
      - uses: actions/checkout@v7
      - name: Dependency review
        uses: actions/dependency-review-action@v5
